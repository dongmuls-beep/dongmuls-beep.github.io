name: Daily ETF Price Update

on:
  schedule:
    # 05:30 UTC (14:30 KST), after the 13:00 KST data refresh
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collection mode'
        type: choice
        options:
          - incremental
          - backfill
        default: incremental

permissions:
  contents: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price tests
        run: pytest tests/test_price_core.py tests/test_price_cli.py -q

      - name: Collect prices
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_price_history.py --mode "$MODE"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update ETF prices (Daily)"
          file_pattern: "prices/*.json prices-meta.json"
